name: ToolController CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            cmake \
            ninja-build \
            gcc \
            python3 \
            python3-pip
          pip3 install --no-cache-dir gcovr

      - name: Cross-Compile STM32H7 Firmware (output to build/)
        run: |
          cmake --preset linux-stm32h7
          cmake --build --preset linux-stm32h7

      - name: Build & Run Unity Unit Tests with Coverage (output to build/)
        run: |
          cmake --preset linux-coverage
          cmake --build --preset linux-coverage
          ctest --preset linux-coverage
          cmake --build --preset linux-coverage --target coverage_report

      - name: Upload Firmware Artifacts (.hex, .bin, .elf)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-stm32h7
          path: |
            build/app/*.hex
            build/app/*.bin
            build/app/*.elf

      - name: Upload Coverage HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: build/coverage_report/
