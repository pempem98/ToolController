name: Surgical Instrument Controller CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ============================================================================
  # 1. BIÊN DỊCH FIRMWARE STM32H7A3ZIT6Q (XUẤT HEX, BIN, ELF, BUILD FOLDER & SOURCE CODE)
  # ============================================================================
  build-firmware:
    name: 🛠️ Build Firmware (STM32H7A3ZIT6Q)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            cmake \
            ninja-build

      - name: Cross-Compile STM32H7A3ZIT6Q Firmware (output to build/)
        run: |
          echo "================================================================="
          echo "  Configuring CMake: linux-stm32h7a3zit6q"
          echo "================================================================="
          cmake --preset linux-stm32h7a3zit6q
          echo "================================================================="
          echo "  Compiling Firmware: linux-stm32h7a3zit6q"
          echo "================================================================="
          cmake --build --preset linux-stm32h7a3zit6q -v

      - name: Generate Firmware Memory Summary
        run: |
          echo "================================================================="
          echo "  Firmware Memory & Section Sizes (arm-none-eabi-size)"
          echo "================================================================="
          arm-none-eabi-size -B build/app/surgical_instrument_controller_stm32h7a3zit6q.elf
          arm-none-eabi-size -A -d build/app/surgical_instrument_controller_stm32h7a3zit6q.elf
          ELF_SIZE=$(stat -c%s "build/app/surgical_instrument_controller_stm32h7a3zit6q.elf" 2>/dev/null || echo "N/A")
          HEX_SIZE=$(stat -c%s "build/app/surgical_instrument_controller_stm32h7a3zit6q.hex" 2>/dev/null || echo "N/A")
          BIN_SIZE=$(stat -c%s "build/app/surgical_instrument_controller_stm32h7a3zit6q.bin" 2>/dev/null || echo "N/A")
          echo "ELF: $ELF_SIZE bytes | HEX: $HEX_SIZE bytes | BIN: $BIN_SIZE bytes"

          echo "### 🛠️ STM32H7A3ZIT6Q (NUCLEO-H7A3ZI-Q) Firmware Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| File Type | File Name | Size (Bytes) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **ELF** | \`surgical_instrument_controller_stm32h7a3zit6q.elf\` | $ELF_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| **HEX** | \`surgical_instrument_controller_stm32h7a3zit6q.hex\` | $HEX_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| **BIN** | \`surgical_instrument_controller_stm32h7a3zit6q.bin\` | $BIN_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Memory Section Details (arm-none-eabi-size)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          arm-none-eabi-size build/app/surgical_instrument_controller_stm32h7a3zit6q.elf >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Package Source Code Snapshot (Clean Git Archive)
        run: |
          mkdir -p release_packages
          git archive --format=zip --output=release_packages/surgical_instrument_controller_source_${GITHUB_SHA::7}.zip HEAD

      # 1. Package: Firmware Binaries (.hex, .bin, .elf)
      - name: Upload Firmware Artifacts (.hex, .bin, .elf)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-stm32h7a3zit6q
          path: |
            build/app/*.hex
            build/app/*.bin
            build/app/*.elf
          if-no-files-found: error

      # 2. Package: Entire Firmware Build Folder (map, asm, objects, binaries)
      - name: Upload Firmware Build Folder (build/)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
          if-no-files-found: error

      # 3. Package: Complete Source Code Archive
      - name: Upload Source Code Archive
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: release_packages/surgical_instrument_controller_source_*.zip
          if-no-files-found: error

  # ============================================================================
  # 2. KIỂM THỬ TỰ ĐỘNG UNITY VÀ ĐO ĐỘ BAO PHỦ MÃ NGUỒN (COVERAGE)
  # ============================================================================
  unit-tests-and-coverage:
    name: 🧪 Unit Tests & Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Host Compiler, Python & gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            g++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip
          pip3 install --no-cache-dir gcovr

      - name: Build Unity Unit Tests with Coverage Flags
        run: |
          echo "================================================================="
          echo "  Configuring CMake: linux-coverage"
          echo "================================================================="
          cmake --preset linux-coverage
          echo "================================================================="
          echo "  Compiling Unit Tests with Coverage"
          echo "================================================================="
          cmake --build --preset linux-coverage -v

      - name: Run Unit Tests & Stream Live Output
        id: run_tests
        run: |
          set -o pipefail
          echo "================================================================="
          echo "  Running Unity Unit Tests (Live Streaming to Runner)"
          echo "================================================================="
          ./build/tests/unit_tests 2>&1 | tee test_results.log

      - name: Generate HTML Coverage Report
        run: |
          echo "================================================================="
          echo "  Generating Coverage Report via gcovr"
          echo "================================================================="
          cmake --build --preset linux-coverage --target coverage_report -v

      - name: Publish Test Results & Coverage Report to Step Summary & Console
        if: always()
        run: |
          echo "================================================================="
          echo "  Unit Test Summary"
          echo "================================================================="
          if [ -f test_results.log ]; then
            TOTAL_TESTS=$(grep -oE "[0-9]+ Tests" test_results.log | head -1 | awk '{print $1}')
            FAILURES=$(grep -oE "[0-9]+ Failures" test_results.log | head -1 | awk '{print $1}')
            IGNORED=$(grep -oE "[0-9]+ Ignored" test_results.log | head -1 | awk '{print $1}')
            PASSED=$((TOTAL_TESTS - FAILURES - IGNORED))

            echo "Total: $TOTAL_TESTS | Passed: $PASSED | Failures: $FAILURES | Ignored: $IGNORED"

            echo "### 🧪 Unity Unit Test Results" >> $GITHUB_STEP_SUMMARY
            echo "| Test Status | Total Tests | Passed | Failures | Ignored |" >> $GITHUB_STEP_SUMMARY
            echo "| :---: | :---: | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
            if [ "$FAILURES" -eq 0 ]; then
              echo "| 🟢 **PASSED** | $TOTAL_TESTS | $PASSED | $FAILURES | $IGNORED |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| 🔴 **FAILED** | $TOTAL_TESTS | $PASSED | $FAILURES | $IGNORED |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "================================================================="
          echo "  Code Coverage Summary (Console)"
          echo "================================================================="
          python3 -m gcovr --root . \
            --filter services \
            --filter connectivity \
            --filter middleware \
            --filter app \
            --filter platform/stm32h7a3zit6q/drivers \
            --exclude tests \
            --exclude build \
            --txt

          echo "### 📊 Code Coverage Summary (gcovr)" >> $GITHUB_STEP_SUMMARY
          python3 -m gcovr --root . \
            --filter services \
            --filter connectivity \
            --filter middleware \
            --filter app \
            --filter platform/stm32h7a3zit6q/drivers \
            --exclude tests \
            --exclude build \
            --markdown >> $GITHUB_STEP_SUMMARY

      # 4. Package: Interactive HTML Coverage Report
      - name: Upload HTML Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: build/coverage_report/
          if-no-files-found: error
