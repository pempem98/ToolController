services:
  surgical-instrument-builder:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: surgical-instrument-env:1.0
    container_name: surgical_instrument_build_env
    # Tự động gán quyền sở hữu file theo UID và GID của máy Host (mặc định 1000:1000 cho Linux/WSL)
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace/surgical-instrument-controller
      - ccache-data:/tmp/.ccache
    working_dir: /workspace/surgical-instrument-controller
    environment:
      - HOME=/tmp
      - CCACHE_DIR=/tmp/.ccache
    # Chạy lệnh kiểm tra môi trường nếu không truyền đối số
    command: >
      bash -c "echo '=== Surgical Instrument Controller Build Environment ===' &&
               gcc --version | head -n 1 &&
               arm-none-eabi-gcc --version | head -n 1 &&
               cmake --version | head -n 1 &&
               ninja --version &&
               ccache --version | head -n 1 &&
               gcovr --version | head -n 1"

volumes:
  ccache-data:
    name: surgical_instrument_ccache_data
